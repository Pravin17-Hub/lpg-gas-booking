<!DOCTYPE html>
<html>
<head>
  <title>Register - LPG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background: url('https://akm-img-a-in.tosshub.com/businesstoday/images/story/202508/6895dd9352b2c-the-ministry-of-petroleum-and-natural-gas-will-oversee-the-distribution-of-the-lpg-compensation-082046112-16x9.png?size=948:533') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
  <div class="bg-white p-4 rounded shadow" style="width: 400px;">
    <h3 class="text-success text-center mb-3">📝 Register</h3>
    <div id="errorMsg" class="alert alert-danger d-none"></div>
    <form id="registerForm" autocomplete="off">
      <div class="mb-3">
        <label for="lpgId">LPG ID</label>
        <input type="text" id="lpgId" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-success btn-lg w-100">Register</button>
    </form>
  </div>
  <script>
    // Example registered users (replace with actual logic)
    const registeredUsers = ['LPG123456', 'LPG654321'];

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const lpgId = document.getElementById('lpgId').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      if (registeredUsers.includes(lpgId)) {
        errorMsg.textContent = 'LPG ID already registered!';
        errorMsg.classList.remove('d-none');
      } else {
        registeredUsers.push(lpgId);
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
