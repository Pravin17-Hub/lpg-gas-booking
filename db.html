<!DOCTYPE html>
<html>
<head>
  <title>Database Connection Status</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .status-box {
      background: #fff;
      padding: 2rem 3rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    .text-success {
      color: #198754;
    }
    .text-danger {
      color: #dc3545;
    }
  </style>
</head>
<body>
  <div class="status-box">
    <h3 id="statusMsg" class="text-success">✅ Connected to Database!</h3>
    <p>Host: <strong>localhost</strong></p>
    <p>User: <strong>root</strong></p>
    <p>Database: <strong>lpg_booking</strong></p>
  </div>
  <script>
    // Simulate connection status (always success in static HTML)
    // To show error, uncomment below:
    // document.getElementById('statusMsg').textContent = '❌ Connection failed!';
    // document.getElementById('statusMsg').className = 'text-danger';
  </script>
