<!DOCTYPE html>
<html>
<head>
  <title>Cancel Bookings</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f8f9fa;
      padding: 2rem;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.07);
      padding: 2rem;
    }
    .text-danger {
      color: #dc3545;
    }
    .btn-secondary {
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3 class="mb-4 text-danger">❌ Cancel Your Bookings</h3>
    <table class="table table-bordered" id="bookingsTable">
      <thead>
        <tr>
          <th>Booking ID</th>
          <th>LPG ID</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows will be inserted by JS -->
      </tbody>
    </table>
    <a href="dashboard.html" class="btn btn-secondary mt-3">🔙 Back</a>
  </div>
  <script>
    // Sample bookings data
    const bookings = [
      { booking_id: 'BOOK001', lpg_id: 'LPG123456' },
      { booking_id: 'BOOK002', lpg_id: 'LPG123456' },
      { booking_id: 'BOOK003', lpg_id: 'LPG123456' }
    ];

    function renderBookings() {
      const tbody = document.querySelector('#bookingsTable tbody');
      tbody.innerHTML = '';
      bookings.forEach((booking, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${booking.booking_id}</td>
          <td>${booking.lpg_id}</td>
          <td>
            <button class="btn btn-danger btn-sm" onclick="cancelBooking(${idx})">Cancel</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function cancelBooking(index) {
      bookings.splice(index, 1);
      renderBookings();
    }

    renderBookings();
  </script>
</body>
</html>
