<!DOCTYPE html>
<html>
<head>
  <title>View Bookings</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-5">
  <div class="container">
    <h3 class="mb-4 text-primary">📋 Your Bookings</h3>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Booking ID</th>
          <th>LPG ID</th>
        </tr>
      </thead>
      <tbody id="bookingsBody">
        <!-- Rows will be inserted by JS -->
      </tbody>
    </table>
    <a href="dashboard.html" class="btn btn-secondary mt-3">🔙 Back</a>
  </div>
  <script>
    // Example bookings data (replace with actual logic)
    const bookings = [
      { booking_id: 'BOOK001', lpg_id: 'LPG123456' },
      { booking_id: 'BOOK002', lpg_id: 'LPG123456' }
    ];

    const tbody = document.getElementById('bookingsBody');
    bookings.forEach(booking => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${booking.booking_id}</td><td>${booking.lpg_id}</td>`;
      tbody.appendChild(tr);
    });
  </script>
