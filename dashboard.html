<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - LPG Booking Portal</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body {
      background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .dashboard-box {
      background: #fff;
      padding: 2.5rem 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      text-align: center;
      width: 100%;
      max-width: 420px;
      transition: box-shadow 0.2s;
    }
    .dashboard-box:hover {
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    }
    .dashboard-title {
      font-weight: 700;
      color: #00796b;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }
    .welcome-msg {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 2rem;
    }
    .dashboard-btn {
      font-size: 1.1rem;
      padding: 0.85rem 1rem;
      border-radius: 0.75rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .dashboard-btn i {
      font-size: 1.3rem;
    }
    .dashboard-btn:last-child {
      margin-bottom: 0;
    }
    @media (max-width: 500px) {
      .dashboard-box {
        padding: 1.2rem 0.5rem;
        max-width: 98vw;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-box shadow">
    <h3 class="dashboard-title mb-2"><i class="bi bi-speedometer2"></i> Dashboard</h3>
    <div class="welcome-msg">
      Welcome, <strong id="lpgId"></strong>
    </div>
    <a href="book.html" class="btn btn-success dashboard-btn w-100 mb-2">
      <i class="bi bi-box-seam"></i> Book Cylinder
    </a>
    <a href="view.html" class="btn btn-info dashboard-btn w-100 mb-2 text-white">
      <i class="bi bi-list-ul"></i> View Bookings
    </a>
    <a href="cancel.html" class="btn btn-danger dashboard-btn w-100 mb-2">
      <i class="bi bi-x-circle"></i> Cancel Booking
    </a>
    <a href="logout.html" class="btn btn-secondary dashboard-btn w-100">
      <i class="bi bi-box-arrow-right"></i> Logout
    </a>
  </div>
  <script>
    // Set LPG ID here (replace with actual logic if needed)
    document.getElementById('lpgId').textContent = 'LPG123456';
  </script>
</body>
</html>
