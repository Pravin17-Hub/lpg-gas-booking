<!DOCTYPE html>
<html>
<head>
  <title>Login - LPG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background: url('https://akm-img-a-in.tosshub.com/businesstoday/images/story/202508/6895dd9352b2c-the-ministry-of-petroleum-and-natural-gas-will-oversee-the-distribution-of-the-lpg-compensation-082046112-16x9.png?size=948:533') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
  <div class="bg-white p-4 rounded shadow" style="width: 400px;">
    <h3 class="text-primary text-center mb-3">🔐 Login</h3>
    <div id="errorMsg" class="alert alert-danger d-none"></div>
    <form id="loginForm" autocomplete="off">
      <div class="mb-3">
        <label for="role">Login as</label>
        <select id="role" class="form-select" required>
          <option value="customer">Customer</option>
          <option value="delivery">Delivery Person</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="lpgId">LPG ID / Delivery ID</label>
        <input type="text" id="lpgId" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
    </form>
  </div>
  <script>
    // Example credentials
    const customer = { lpg_id: 'LPG123456', password: '123user123' };
    const deliveryPerson = { delivery_id: 'del123456', password: 'deliverypass123' };

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const role = document.getElementById('role').value;
      const lpgId = document.getElementById('lpgId').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.classList.add('d-none');

      if (role === 'customer') {
        // Customer logs in and will provide address on booking/delivery page
        if (lpgId === customer.lpg_id && password === customer.password) {
          window.location.href = 'dashboard.html';
        } else {
          errorMsg.textContent = 'Invalid customer credentials.';
          errorMsg.classList.remove('d-none');
        }
      } else if (role === 'delivery') {
        // Delivery person logs in, does NOT provide address
        if (lpgId === deliveryPerson.delivery_id && password === deliveryPerson.password) {
          window.location.href = 'delivery-cylineder.html';
        } else {
          errorMsg.textContent = 'Invalid delivery person credentials.';
          errorMsg.classList.remove('d-none');
        }
      }
    });
  </script>
</body>
</html>
