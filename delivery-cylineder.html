<!DOCTYPE html>
<html>
<head>
  <title>LPG Cylinder Delivery Portal</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      background: #f0f8ff;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.08);
      padding: 2rem;
    }
    #map {
      height: 400px;
      border-radius: 1rem;
      margin-bottom: 2rem;
      width: 100%;
      /* Remove display: none to always show the map */
    }
    .status-box {
      text-align: center;
      margin-bottom: 2rem;
    }
    .cylinder-img {
      width: 80px;
      margin-bottom: 1rem;
    }
    .delivered {
      color: #28a745;
      font-weight: bold;
    }
    .in-transit {
      color: #007bff;
      font-weight: bold;
    }
    #addressForm {
      max-width: 500px;
      margin: 0 auto 2rem auto;
    }
    #openMapBtn {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4 text-center">🚚 LPG Cylinder Delivery Portal</h2>
    <form id="addressForm" class="mb-4">
      <div class="input-group">
        <input type="text" id="addressInput" class="form-control" placeholder="Enter your address" required>
        <button type="submit" class="btn btn-primary">Set Delivery Location</button>
      </div>
      <div id="addressError" class="text-danger mt-2"></div>
    </form>
    <div class="status-box">
      <img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png" alt="Cylinder" class="cylinder-img">
      <div id="deliveryStatus" class="in-transit">Enter your address to start delivery...</div>
    </div>
    <div id="bookingDetails" class="mb-4" style="display:none;">
      <h5 class="mb-3 text-primary">Delivery Details</h5>
      <div><strong>Name:</strong> <span id="dName"></span></div>
      <div><strong>Phone:</strong> <span id="dPhone"></span></div>
      <div><strong>Address:</strong> <span id="dAddress"></span></div>
      <div><strong>LPG ID:</strong> <span id="dLpgId"></span></div>
      <div><strong>Booking ID:</strong> <span id="dBookingId"></span></div>
    </div>
    <div id="map"></div>
    <div class="text-center">
      <a id="openMapBtn" class="btn btn-success mb-3" target="_blank">Open in Google Maps</a>
      <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">🔙 Back to Dashboard</button>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Show latest booking details if available
    const latestBooking = JSON.parse(localStorage.getItem('latestBooking') || 'null');
    if (latestBooking) {
      document.getElementById('bookingDetails').style.display = '';
      document.getElementById('dName').textContent = latestBooking.name;
      document.getElementById('dPhone').textContent = latestBooking.phone;
      document.getElementById('dAddress').textContent = latestBooking.address;
      document.getElementById('dLpgId').textContent = latestBooking.lpg_id;
      document.getElementById('dBookingId').textContent = latestBooking.booking_id;
      document.getElementById('addressInput').value = latestBooking.address;
    }

    let map, agencyMarker, customerMarker, cylinderMarker;
    const agencyLocation = [13.0827, 80.2707]; // Chennai

    // Initialize map on page load, centered on agency
    window.onload = function() {
      map = L.map('map').setView(agencyLocation, 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      agencyMarker = L.marker(agencyLocation).addTo(map).bindPopup('Agency').openPopup();

      // Add this block for click-to-open in Google Maps
      map.on('click', function(e) {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;
        const url = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
        window.open(url, '_blank');
      });
    };

    document.getElementById('addressForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const address = document.getElementById('addressInput').value.trim();
      const errorDiv = document.getElementById('addressError');
      errorDiv.textContent = '';
      if (!address) {
        errorDiv.textContent = 'Please enter a valid address.';
        return;
      }
      document.getElementById('deliveryStatus').textContent = 'Locating address...';

      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`)
        .then(response => response.json())
        .then(data => {
          if (data.length === 0) {
            errorDiv.textContent = 'Address not found. Please try again.';
            document.getElementById('deliveryStatus').textContent = 'Enter your address to start delivery...';
            return;
          }
          const customerLocation = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
          showMap(agencyLocation, customerLocation, address);
        })
        .catch(() => {
          errorDiv.textContent = 'Error fetching location. Try again.';
          document.getElementById('deliveryStatus').textContent = 'Enter your address to start delivery...';
        });
    });

    function showMap(agencyLoc, customerLoc, address) {
      // Remove previous markers if any
      if (customerMarker) map.removeLayer(customerMarker);
      if (cylinderMarker) map.removeLayer(cylinderMarker);

      customerMarker = L.marker(customerLoc).addTo(map).bindPopup('Customer Home');
      cylinderMarker = L.marker(agencyLoc, {
        icon: L.icon({
          iconUrl: 'https://cdn-icons-png.flaticon.com/512/1046/1046857.png',
          iconSize: [40, 40],
          iconAnchor: [20, 40]
        })
      }).addTo(map);

      map.fitBounds([agencyLoc, customerLoc], {padding: [50, 50]});
      document.getElementById('deliveryStatus').textContent = 'Cylinder is on the way...';
      document.getElementById('deliveryStatus').className = 'in-transit';

      // Animate cylinder
      simulateDelivery(agencyLoc, customerLoc);

      // Show "Open in Google Maps" button
      const openMapBtn = document.getElementById('openMapBtn');
      openMapBtn.style.display = '';
      openMapBtn.href = `https://www.google.com/maps/search/?api=1&query=${customerLoc[0]},${customerLoc[1]}`;
      openMapBtn.textContent = "Open in Google Maps";
    }

    function simulateDelivery(start, end) {
      let progress = 0;
      const steps = 100;
      const interval = 50; // ms

      function interpolate(a, b, t) {
        return a + (b - a) * t;
      }
      function moveCylinder() {
        if (progress <= steps) {
          const lat = interpolate(start[0], end[0], progress/steps);
          const lng = interpolate(start[1], end[1], progress/steps);
          cylinderMarker.setLatLng([lat, lng]);
          progress++;
          setTimeout(moveCylinder, interval);
        } else {
          document.getElementById('deliveryStatus').textContent = "Cylinder delivered at your home!";
          document.getElementById('deliveryStatus').className = "delivered";
          cylinderMarker.setLatLng(end);
          cylinderMarker.bindPopup('Cylinder Delivered!').openPopup();
        }
      }
      moveCylinder();
    }
  </script>
</body>
</html>
